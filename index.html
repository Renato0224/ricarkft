<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RICAR KFT - Használtautó Kereskedés</title>
  
  <!-- Netlify Identity (A bejelentkezéshez kell) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header { background: #1a252f; color: white; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.8rem; font-weight: bold; color: #e74c3c; }
    .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center; color: white; text-align: center; padding: 4rem 1rem; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 1.5rem; }
    .card-title { font-size: 1.3rem; margin-bottom: 0.5rem; color: #2c3e50; }
    .price { font-size: 1.4rem; font-weight: bold; color: #e74c3c; margin-top: 1rem; }
    .details { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 0.5rem; }
    footer { background: #1a252f; color: white; text-align: center; padding: 1.5rem; margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">RICAR KFT</div>
    <div>Megbízható használtautók</div>
  </header>

  <section class="hero">
    <h1>Találd meg a neked való autót!</h1>
    <p>Minőségi kínálat, átvizsgált gépjárművek.</p>
  </section>

  <div class="container">
    <h2 style="margin-bottom: 1.5rem; color: #2c3e50;">Kínálatunk</h2>
    <div class="grid">
      
      <!-- Minta autó -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80" alt="Autó">
        <div class="card-body">
          <div class="card-title">BMW 320d Touring</div>
          <div class="details">Évjárat: 2018 | Dízel | Automata</div>
          <div class="price">5 890 000 Ft</div>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2026 RICAR KFT - Minden jog fenntartva.</p>
  </footer>

  <!-- Bejelentkezést kezelő kód -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
